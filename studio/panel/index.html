<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel del Estudio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='4' fill='%235b4bdb'/></svg>">
<style>
:root {
  --bg: #f6f5f1; --surface: #ffffff; --surface-2: #f0eee8; --text: #1d1c19; --muted: #6b675e;
  --line: #e2dfd6; --accent: #5b4bdb; --accent-soft: #ebe8ff;
  --ok: #1f8a4c; --ok-soft: #e3f4ea; --warn: #b26a00; --warn-soft: #fbf0dc;
  --bad: #c2362f; --bad-soft: #fbe5e3; --info: #2266b8; --info-soft: #e2eefb;
  --radius: 12px; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131316; --surface: #1c1c21; --surface-2: #24242b; --text: #ecebe8; --muted: #9a978f;
    --line: #2f2f37; --accent: #9d93ff; --accent-soft: #2a2747;
    --ok: #55c785; --ok-soft: #173325; --warn: #e3a64a; --warn-soft: #362a16;
    --bad: #ef7a72; --bad-soft: #3a1d1b; --info: #78aef0; --info-soft: #172a40;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131316; --surface: #1c1c21; --surface-2: #24242b; --text: #ecebe8; --muted: #9a978f;
  --line: #2f2f37; --accent: #9d93ff; --accent-soft: #2a2747;
  --ok: #55c785; --ok-soft: #173325; --warn: #e3a64a; --warn-soft: #362a16;
  --bad: #ef7a72; --bad-soft: #3a1d1b; --info: #78aef0; --info-soft: #172a40;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 60px; }
header.top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.brand { font-weight: 700; font-size: 17px; letter-spacing: -.01em; }
.brand span { color: var(--muted); font-weight: 500; }
.games { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
.game-tab { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 999px; padding: 5px 12px; cursor: pointer; font: inherit; font-size: 13px; }
.game-tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.live { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.dot.stale { background: var(--muted); }
.theme-btn { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 8px; padding: 4px 8px; cursor: pointer; font-size: 12px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
.hero { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: end; margin-bottom: 16px; }
.hero h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: -.02em; }
.pitch { color: var(--muted); margin: 0; max-width: 70ch; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.chip { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.progress-num { text-align: right; }
.progress-num b { font-size: 30px; letter-spacing: -.02em; }
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 14px; grid-column: 1 / -1; display: flex; }
.bar i { display: block; height: 100%; }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
.stat { padding: 12px 14px; }
.stat .n { font-size: 22px; font-weight: 700; }
.stat .l { font-size: 12px; color: var(--muted); }

.now { border-left: 4px solid var(--accent); margin-bottom: 16px; }
.now.blocked { border-left-color: var(--bad); }
.now h2 { margin: 2px 0 6px; font-size: 19px; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.criteria { margin: 8px 0 0; padding-left: 18px; }

.grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 16px; align-items: start; }
section h3 { margin: 0 0 12px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
section h3 .count { font-size: 12px; color: var(--muted); font-weight: 500; }
.stack { display: grid; gap: 16px; }

.phase { border-top: 1px solid var(--line); }
.phase:first-of-type { border-top: 0; }
.phase summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; padding: 10px 0; align-items: center; }
.phase summary::-webkit-details-marker { display: none; }
.pid { font: 600 12px ui-monospace, Consolas, monospace; color: var(--muted); }
.ptitle { font-weight: 550; }
.pbody { padding: 0 0 14px 62px; font-size: 14px; }
.pbody ul { margin: 4px 0 8px; padding-left: 18px; }
.pbody .meta { color: var(--muted); font-size: 13px; }
.thumb { display: block; width: 100%; max-width: 420px; border-radius: 8px; border: 1px solid var(--line); margin-top: 8px; }

.badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.b-hecha, .b-resuelto, .b-baja { background: var(--ok-soft); color: var(--ok); }
.b-en-curso, .b-media { background: var(--info-soft); color: var(--info); }
.b-pendiente { background: var(--surface-2); color: var(--muted); }
.b-bloqueada, .b-abierto, .b-alta { background: var(--bad-soft); color: var(--bad); }

.item { padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
.item:first-of-type { border-top: 0; padding-top: 0; }
.item .why { color: var(--muted); font-size: 13px; margin-top: 2px; }
.item .row { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; }
.item.closed { opacity: .5; }

.err { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); font-size: 14px; }
.err:first-of-type { border-top: 0; padding-top: 0; }
.err .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin-bottom: 2px; }
.err-head { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }

.feed { font-size: 13px; max-height: 360px; overflow: auto; }
.feed div { padding: 5px 0; border-top: 1px dashed var(--line); display: grid; grid-template-columns: 74px 1fr; gap: 8px; }
.feed div:first-child { border-top: 0; }
.feed time { color: var(--muted); font-variant-numeric: tabular-nums; }
.concept b { display: block; }
.empty { color: var(--muted); font-size: 14px; font-style: italic; }
.welcome { text-align: center; padding: 60px 20px; }
.welcome code { background: var(--surface-2); padding: 2px 6px; border-radius: 6px; }

.view-tab { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 8px; padding: 4px 10px; cursor: pointer; font: inherit; font-size: 13px; }
.view-tab[aria-pressed="true"] { color: var(--text); border-color: var(--accent); }
.guide { columns: 2; column-gap: 16px; }
.guide > .card { break-inside: avoid; margin-bottom: 16px; }
.guide .intro { column-span: all; }
.guide .intro p { margin: 4px 0 0; color: var(--muted); }
.where { font-size: 12px; color: var(--muted); margin: -6px 0 10px; }
.cmd { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding: 10px 0; border-top: 1px solid var(--line); align-items: center; }
.cmd:first-of-type { border-top: 0; padding-top: 0; }
.cmd code { font: 13px ui-monospace, Consolas, monospace; background: var(--surface-2); padding: 3px 7px; border-radius: 6px; overflow-wrap: anywhere; justify-self: start; }
.cmd .what { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.copy { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 6px; padding: 2px 8px; cursor: pointer; font-size: 12px; }
.copy.ok { color: var(--ok); border-color: var(--ok); }
.tips { margin: 0; padding-left: 18px; font-size: 14px; }
.tips li { margin: 4px 0; }
@media (max-width: 860px) { .guide { columns: 1; } }

@media (max-width: 860px) {
  .grid { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .err { grid-template-columns: 1fr; }
  .hero { grid-template-columns: 1fr; }
  .progress-num { text-align: left; }
  .pbody { padding-left: 0; }
}

/* Marcas de lectura y nueva organización (P1) */
.marca { display:inline-flex; align-items:center; justify-content:center; width:22px; font-size:13px; flex:none; }
.m-nuevo { color: var(--info); } .m-actualizado { color: var(--warn); } .m-sinleer { color: var(--accent); } .m-leido { color: var(--muted); opacity:.7; }
.phase summary { grid-template-columns: 24px 44px 1fr auto auto; }
.ses { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.novedades { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:16px; padding:12px 16px; }
.nov-txt { flex: 1 1 260px; }
.leyenda { display:flex; gap:10px; font-size:12px; color:var(--muted); flex-wrap:wrap; }
.btn-sm { border:1px solid var(--line); background:var(--surface); color:var(--text); border-radius:8px; padding:4px 10px; cursor:pointer; font:inherit; font-size:13px; }
.btn-sm:hover { border-color: var(--accent); }
.ahora { margin-bottom: 16px; }
.ahora .eyebrow { margin-bottom: 8px; }
.ahora-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap:10px; }
.ahora .now { margin:0; padding:14px; }
.ahora .now h2 { font-size:16px; margin:6px 0 4px; }
.now-head { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.now-obj { font-size:13px; color:var(--muted); }
.bloque { padding: 4px 0 10px; border-top: 1px solid var(--line); }
.bloque:first-of-type { border-top: 0; }
.bloque-head { display:flex; justify-content:space-between; align-items:baseline; margin-top:8px; }
.bloque-desc { font-size:12px; color:var(--muted); }
.minibar { height:4px; background:var(--surface-2); border-radius:99px; overflow:hidden; margin:6px 0 4px; }
.minibar i { display:block; height:100%; background: var(--ok); }
.subtabs { display:flex; gap:4px; flex-wrap:wrap; border-bottom:1px solid var(--line); margin:-4px 0 12px; }
.subtab { border:0; background:none; color:var(--muted); font:inherit; font-size:13px; padding:6px 10px; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
.subtab[aria-selected="true"] { color:var(--text); border-bottom-color: var(--accent); font-weight:600; }
.pill { display:inline-block; min-width:18px; padding:0 6px; border-radius:999px; background:var(--accent); color:#fff; font-size:11px; line-height:18px; text-align:center; }
.subtab-tools { display:flex; justify-content:flex-end; margin-bottom:6px; }
.subtab-body h4 { margin: 12px 0 6px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.item { display:grid; grid-template-columns: 24px 1fr; gap:6px; align-items:start; cursor:pointer; }
.item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.item .err { border-top: 0; padding: 0; }
.grid { grid-template-columns: 1.25fr 1fr; }
@media (max-width: 860px) {
  .grid { grid-template-columns: 1fr; }
  .phase summary { grid-template-columns: 22px 34px 1fr auto; gap: 6px; }
  .phase summary .ses { display: none; }
  .pbody { padding-left: 0; }
}

.version { border-top: 1px solid var(--line); padding: 4px 0; }
.version:first-of-type { border-top: 0; }
.version-head { list-style: none; cursor: pointer; display: flex; gap: 8px; align-items: center; padding: 8px 0 2px; }
.version-head::-webkit-details-marker { display: none; }
.version-head::before { content: '▸'; color: var(--muted); width: 12px; }
.version[open] > .version-head::before { content: '▾'; }
.version-head .count { margin-left: auto; color: var(--muted); font-size: 12px; }
.vnum { font: 700 13px ui-monospace, Consolas, monospace; color: var(--accent); min-width: 36px; }
.tramo { margin: 6px 0 4px 20px; }
.tramo-head { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); margin: 8px 0 2px; }
.tramo-head .count { margin-left: auto; }
.tr { font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 1px 7px; border-radius: 999px; font-size: 10px; }
.tr-alfa { background: var(--warn-soft); color: var(--warn); } .tr-beta { background: var(--info-soft); color: var(--info); }
.rango { font-family: ui-monospace, Consolas, monospace; }
@media (max-width: 860px) { .tramo { margin-left: 0; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Estudio <span>· panel</span></div>
    <nav class="games" id="games" aria-label="Juegos"></nav>
    <button class="view-tab" id="v-progreso" type="button">Progreso</button>
    <button class="view-tab" id="v-guia" type="button">Comandos</button>
    <button class="view-tab" id="v-modelos" type="button">Pixel art propio</button>
    <button class="view-tab" id="v-requisitos" type="button">Lo que pediste</button>
    <div class="live"><span class="dot" id="dot"></span><span id="updated">—</span></div>
    <button class="theme-btn" id="theme" type="button" title="Cambiar tema">◐</button>
  </header>
  <main id="app"><p class="empty">Cargando…</p></main>
</div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
let juego = store.get('panel.juego');
let ultimo = null;

const t = store.get('panel.tema'); if (t) document.documentElement.dataset.theme = t;
$('#theme').onclick = () => {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const cur = document.documentElement.dataset.theme || (dark ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next; store.set('panel.tema', next);
};

function hace(iso) {
  if (!iso) return '—';
  const s = Math.round((Date.now() - new Date(iso)) / 1000);
  if (s < 60) return 'hace un momento';
  if (s < 3600) return `hace ${Math.round(s / 60)} min`;
  if (s < 86400) return `hace ${Math.round(s / 3600)} h`;
  return new Date(iso).toLocaleDateString('es', { day: 'numeric', month: 'short' });
}
const hora = (iso) => new Date(iso).toLocaleString('es', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
function dur(a, b) {
  if (!a || !b) return '';
  const m = Math.round((new Date(b) - new Date(a)) / 60000);
  return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${m % 60} min`;
}
const badge = (txt) => `<span class="badge b-${esc(txt)}">${esc(txt)}</span>`;
const prio = { alta: 0, media: 1, baja: 2 };
const porPrio = (a, b) => (a.cerrado - b.cerrado) || ((prio[a.prioridad] ?? 1) - (prio[b.prioridad] ?? 1));

// ── Marcas «nuevo · actualizado · sin leer · leído» ──────────────────────────────────────
// Cada elemento tiene una firma que cambia cuando cambia algo importante (estado, avance…).
// «Nuevo/actualizado» compara con lo que había en tu visita anterior; «leído» se guarda al abrirlo.
const marcas = {
  slug: null, previo: {}, leidos: {},
  iniciar(slug, items) {
    if (this.slug === slug) return;
    this.slug = slug;
    const leerJson = (k) => { try { return JSON.parse(store.get(k) || '{}'); } catch { return {}; } };
    this.previo = leerJson(`panel.vistos.${slug}`);
    this.leidos = leerJson(`panel.leidos.${slug}`);
    // Lo que ves ahora deja de ser «nuevo» en tu próxima visita (no en esta).
    store.set(`panel.vistos.${slug}`, JSON.stringify(Object.fromEntries(items.map((i) => [i.clave, i.firma]))));
  },
  estado(i) {
    if (this.leidos[i.clave] === i.firma) return 'leido';
    if (!(i.clave in this.previo)) return 'nuevo';
    if (this.previo[i.clave] !== i.firma) return 'actualizado';
    return 'sinleer';
  },
  leer(items) {
    for (const i of items) this.leidos[i.clave] = i.firma;
    store.set(`panel.leidos.${this.slug}`, JSON.stringify(this.leidos));
  },
};
const ICONO = { nuevo: ['🆕', 'Nuevo desde tu última visita'], actualizado: ['🔄', 'Ha cambiado desde tu última visita'], sinleer: ['●', 'Sin leer'], leido: ['✓', 'Leído'] };
const marca = (i) => { const e = marcas.estado(i); return `<span class="marca m-${e}" title="${ICONO[e][1]}" aria-label="${ICONO[e][1]}">${ICONO[e][0]}</span>`; };

/** Todos los elementos marcables de la bitácora, con su clave y su firma. */
function marcables(e) {
  return [
    ...(e.fases || []).map((f) => ({ tipo: 'fase', clave: `fase:${f.id}`, firma: `${f.estado}|${f.hecho?.length ?? 0}|${f.commit ?? ''}|${f.motivo ?? ''}`, ref: f })),
    ...e.decisiones.map((x) => ({ tipo: 'decision', clave: `dec:${x.id}`, firma: x.id, ref: x })),
    ...e.errores.map((x) => ({ tipo: 'error', clave: `err:${x.id}`, firma: `${x.id}|${x.estado}`, ref: x })),
    ...e.faltantes.map((x) => ({ tipo: 'falta', clave: `fal:${x.id}`, firma: `${x.id}|${x.cerrado ? 1 : 0}`, ref: x })),
    ...e.recomendaciones.map((x) => ({ tipo: 'reco', clave: `rec:${x.id}`, firma: `${x.id}|${x.cerrado ? 1 : 0}`, ref: x })),
    ...e.conceptos.map((x) => ({ tipo: 'concepto', clave: `con:${x.id}`, firma: x.id, ref: x })),
  ];
}

const BLOQUES = [
  { pref: 'A', nombre: 'Dirección artística y prototipos', desc: 'Laboratorio de arte, terreno continuo y construcción libre' },
  { pref: 'C', nombre: 'Cámara', desc: 'Cámara de estrategia (docs/prompts/camara.md)' },
  { pref: 'P', nombre: 'Panel del estudio', desc: 'Este panel' },
];
const SESION = { A: 'A · Opus', B: 'B · Sonnet 5.5', C: 'C · Sonnet 5' };

function fase(f, slug, item) {
  const v = f.verificacion || {};
  const capturas = [].concat(v.captura || v.capturas || []);
  return `<details class="phase" data-id="${esc(f.id)}" data-clave="${esc(item.clave)}">
    <summary>${marca(item)}<span class="pid">${esc(f.id)}</span><span class="ptitle">${esc(f.titulo)}</span>${f.sesion ? `<span class="ses">${esc(SESION[f.sesion] ?? f.sesion)}</span>` : ''}${badge(f.estado)}</summary>
    <div class="pbody">
      ${f.objetivo ? `<div>${esc(f.objetivo)}</div>` : ''}
      ${f.criterios?.length ? `<div class="meta" style="margin-top:6px">Criterios</div><ul>${f.criterios.map((c) => `<li>${esc(c)}</li>`).join('')}</ul>` : ''}
      ${f.hecho?.length ? `<div class="meta">Hecho</div><ul>${f.hecho.map((c) => `<li>${esc(c)}</li>`).join('')}</ul>` : ''}
      ${f.motivo ? `<div class="meta">Motivo del bloqueo: ${esc(f.motivo)}</div>` : ''}
      <div class="meta">${[v.tests && `Tests: ${esc(v.tests)}`, v.resultado && esc(v.resultado), dur(f.inicio, f.fin) && `Duración: ${dur(f.inicio, f.fin)}`, f.commit && `Commit ${esc(f.commit)}`].filter(Boolean).join(' · ')}</div>
      ${capturas.map((c) => `<a href="/evidencia/${esc(slug)}/${esc(c)}" target="_blank"><img class="thumb" loading="lazy" src="/evidencia/${esc(slug)}/${esc(c)}" alt="Captura ${esc(f.id)}"></a>`).join('')}
    </div></details>`;
}

function lista(items, render, vacio) {
  return items.length ? items.map(render).join('') : `<p class="empty">${vacio}</p>`;
}

let pestana = store.get('panel.pestana') || 'decisiones';
const NOMBRE_VERSION = { '0.0': 'Base: laboratorio, terreno, construcción y cámara', '0.1': 'La aldea junto al río', '0.2': 'La casa del dios', '0.3': 'El ensi y los poderosos', '0.4': 'Tierra entre ríos', '0.5': 'Lanzas de cobre', '0.6': 'Tablillas y templos', '0.7': 'Otras orillas', '0.8': 'Los que guardan los cedros', '0.9': 'Equilibrio', '1.0': 'Lanzamiento' };
let versionesTocadas = store.get('panel.versiones') !== null;
const versionesAbiertas = new Set((() => { try { return JSON.parse(store.get('panel.versiones') || '[]'); } catch { return []; } })());

function render(e) {
  const slug = e.juego.slug;
  const F = e.fases || [];
  const items = marcables(e);
  marcas.iniciar(slug, items);
  const porClave = new Map(items.map((i) => [i.clave, i]));
  const it = (clave) => porClave.get(clave);
  const n = (s) => F.filter((f) => f.estado === s).length;
  const total = F.length || 1;
  const activas = F.filter((f) => f.estado === 'en-curso' || f.estado === 'bloqueada');
  const cuenta = (filtro) => { const c = { nuevo: 0, actualizado: 0, sinleer: 0 }; for (const i of items.filter(filtro)) { const s = marcas.estado(i); if (s in c) c[s]++; } return c; };
  const total0 = cuenta(() => true);
  const pend = (tipo) => { const c = cuenta((i) => i.tipo === tipo); return c.nuevo + c.actualizado + c.sinleer; };
  const abiertos = new Set([...document.querySelectorAll('details.phase[open]')].map((d) => d.dataset.id));
  const faltAb = e.faltantes.filter((x) => !x.cerrado);
  const recoAb = e.recomendaciones.filter((x) => !x.cerrado);

  const fila = (i, contenido) => `<div class="item ${i.ref.cerrado ? 'closed' : ''}" data-clave="${esc(i.clave)}" tabindex="0">${marca(i)}<div class="item-c">${contenido}</div></div>`;
  const PESTANAS = {
    decisiones: { titulo: 'Decisiones', tipo: 'decision', html: () => lista([...e.decisiones].reverse(), (x) => fila(it(`dec:${x.id}`), `<div class="row"><span>${esc(x.texto)}</span>${x.fase ? `<span class="pid">${esc(x.fase)}</span>` : ''}</div>${x.porque ? `<div class="why">${esc(x.porque)}</div>` : ''}`), 'Sin decisiones registradas.') },
    pendientes: { titulo: 'Faltas y recomendaciones', tipo: ['falta', 'reco'], html: () =>
      `<h4>Lo que falta</h4>` + lista([...e.faltantes].sort(porPrio), (x) => fila(it(`fal:${x.id}`), `<div class="row"><span>${esc(x.texto)}</span>${badge(x.prioridad)}</div>${x.area ? `<div class="why">${esc(x.area)}</div>` : ''}`), 'Nada pendiente detectado.') +
      `<h4>Recomendaciones</h4>` + lista([...e.recomendaciones].sort(porPrio), (x) => fila(it(`rec:${x.id}`), `<div class="row"><span><b>${esc(x.area || 'general')}</b> · ${esc(x.texto)}</span>${badge(x.prioridad)}</div>${x.porque ? `<div class="why">${esc(x.porque)}</div>` : ''}`), 'Sin recomendaciones todavía.') },
    errores: { titulo: 'Errores', tipo: 'error', html: () => lista([...e.errores].reverse(), (x) => fila(it(`err:${x.id}`), `<div class="err">
          <div class="err-head"><span class="pid">${esc(x.id)}</span>${x.fase ? `<span>${esc(x.fase)}</span>` : ''}${badge(x.estado)}<span>${hora(x.t)}</span></div>
          <div><div class="k">Síntoma</div>${esc(x.sintoma)}</div><div><div class="k">Causa</div>${esc(x.causa || '—')}</div><div><div class="k">Solución</div>${esc(x.solucion || '—')}</div></div>`), 'Sin errores registrados.') },
    conceptos: { titulo: 'Aprendizaje', tipo: 'concepto', html: () => lista([...e.conceptos].reverse(), (x) => fila(it(`con:${x.id}`), `<b>${esc(x.concepto)}</b><div class="why">${esc(x.explicacion)}</div>`), 'Aquí aparecerán conceptos de gamedev explicados.') },
    actividad: { titulo: 'Actividad', tipo: null, html: () => `<div class="feed">${lista(e.actividad.slice(0, 60), (a) => `<div><time>${hora(a.t)}</time><span>${esc(a.texto)}</span></div>`, 'Sin actividad.')}</div>` },
  };
  if (!PESTANAS[pestana]) pestana = 'decisiones';
  const pendPestana = (p) => p.tipo ? [].concat(p.tipo).reduce((s, t) => s + pend(t), 0) : 0;

  $('#app').innerHTML = `
  <div class="card hero">
    <div>
      <h1>${esc(e.juego.nombre)}</h1>
      ${e.juego.pitch ? `<p class="pitch">${esc(e.juego.pitch)}</p>` : ''}
      <div class="chips">${[e.juego.motor, e.juego.genero, ...(e.juego.pilares || [])].filter(Boolean).map((c) => `<span class="chip">${esc(c)}</span>`).join('')}</div>
    </div>
    <div class="progress-num"><b>${n('hecha')}</b> <span style="color:var(--muted)">/ ${F.length} fases</span></div>
    <div class="bar" title="hechas · en curso · bloqueadas">
      <i style="width:${(n('hecha') / total) * 100}%;background:var(--ok)"></i>
      <i style="width:${(n('en-curso') / total) * 100}%;background:var(--info)"></i>
      <i style="width:${(n('bloqueada') / total) * 100}%;background:var(--bad)"></i>
    </div>
  </div>

  <div class="card novedades">
    <div class="nov-txt">${total0.nuevo + total0.actualizado + total0.sinleer === 0 ? '<b>✓ Estás al día.</b> No hay nada nuevo ni sin leer.' :
      `<b>Novedades:</b> <span class="m-nuevo">🆕 ${total0.nuevo} nuevos</span> · <span class="m-actualizado">🔄 ${total0.actualizado} actualizados</span> · <span class="m-sinleer">● ${total0.sinleer} sin leer</span>`}</div>
    <div class="leyenda"><span>🆕 nuevo</span><span>🔄 actualizado</span><span>● sin leer</span><span>✓ leído</span></div>
    ${total0.nuevo + total0.actualizado + total0.sinleer ? '<button class="btn-sm" type="button" id="leer-todo">Marcar todo como leído</button>' : ''}
  </div>

  <section class="ahora">
    <div class="eyebrow">Ahora mismo · ${activas.length} en curso</div>
    <div class="ahora-grid">${activas.length ? activas.map((f) => `<div class="card now ${f.estado === 'bloqueada' ? 'blocked' : ''}">
        <div class="now-head"><span class="pid">${esc(f.id)}</span>${f.sesion ? `<span class="ses">${esc(SESION[f.sesion] ?? f.sesion)}</span>` : ''}${badge(f.estado)}</div>
        <h2>${esc(f.titulo)}</h2><div class="now-obj">${esc(f.objetivo)}</div>
        ${f.motivo ? `<div style="color:var(--bad);margin-top:6px">${esc(f.motivo)}</div>` : ''}
      </div>`).join('') : `<div class="card now"><h2>Sin fases en curso</h2></div>`}</div>
  </section>

  <div class="grid">
    <section class="card"><h3>Roadmap hasta la 1.0 <span class="count">${n('hecha')} hechas · ${n('en-curso')} en curso · ${n('pendiente')} pendientes · ${F.length} fases</span></h3>
      ${(() => {
        // Roadmap por versiones (R38): cada versión, plegable, con su tramo alfa y beta y su rango de fases.
        const versiones = [...new Set(F.map((f) => f.version ?? 'sin versión'))];
        return versiones.map((v) => {
          const fv = F.filter((f) => (f.version ?? 'sin versión') === v);
          const hv = fv.filter((f) => f.estado === 'hecha').length;
          const activa = fv.some((f) => f.estado === 'en-curso' || f.estado === 'bloqueada');
          const abierta = versionesAbiertas.has(v) || (!versionesTocadas && activa);
          const tramos = ['alfa', 'beta', undefined].map((tr) => fv.filter((f) => f.tramo === tr)).filter((x) => x.length);
          return `<details class="version" data-version="${esc(v)}" ${abierta ? 'open' : ''}>
            <summary class="version-head"><span class="vnum">${v === 'sin versión' ? '—' : 'v' + esc(v)}</span><b>${esc(NOMBRE_VERSION[v] ?? '')}</b>${activa ? '<span class="badge b-en-curso">en curso</span>' : ''}<span class="count">${hv}/${fv.length}</span></summary>
            <div class="minibar"><i style="width:${(hv / fv.length) * 100}%"></i></div>
            ${tramos.map((ft) => { const h = ft.filter((f) => f.estado === 'hecha').length; const tr = ft[0].tramo;
              return `<div class="tramo"><div class="tramo-head">${tr ? `<span class="tr tr-${esc(tr)}">${esc(tr)}</span>` : ''}<span class="rango">${esc(ft[0].id)}${ft.length > 1 ? ' – ' + esc(ft[ft.length - 1].id) : ''}</span><span class="count">${h}/${ft.length}</span></div>
                ${ft.map((f) => fase(f, slug, it(`fase:${f.id}`))).join('')}</div>`; }).join('')}
          </details>`;
        }).join('');
      })()}
      ${F.length ? '' : '<p class="empty">Todavía no hay roadmap. Usa /roadmap.</p>'}
    </section>
    <section class="card">
      <div class="subtabs" role="tablist">${Object.entries(PESTANAS).map(([k, p]) => { const c = pendPestana(p);
        return `<button type="button" role="tab" class="subtab" data-p="${k}" aria-selected="${k === pestana}">${esc(p.titulo)}${c ? ` <span class="pill">${c}</span>` : ''}</button>`; }).join('')}</div>
      <div class="subtab-body">
        ${PESTANAS[pestana].tipo ? `<div class="subtab-tools"><button class="btn-sm" type="button" id="leer-pestana">Marcar esta pestaña como leída</button></div>` : ''}
        ${PESTANAS[pestana].html()}
      </div>
    </section>
  </div>`;

  abiertos.forEach((id) => document.querySelector(`details.phase[data-id="${CSS.escape(id)}"]`)?.setAttribute('open', ''));
  document.querySelectorAll('details.version').forEach((d) => d.addEventListener('toggle', () => {
    versionesTocadas = true;
    d.open ? versionesAbiertas.add(d.dataset.version) : versionesAbiertas.delete(d.dataset.version);
    store.set('panel.versiones', JSON.stringify([...versionesAbiertas]));
  }));
  const repintar = () => { ultimo = null; render(e); ultimo = e.actualizado; };
  // Abrir una fase o tocar un elemento lo marca como leído.
  document.querySelectorAll('details.phase').forEach((d) => d.addEventListener('toggle', () => { if (d.open) { const i = porClave.get(d.dataset.clave); if (i && marcas.estado(i) !== 'leido') { marcas.leer([i]); d.querySelector('.marca').outerHTML = marca(i); actualizarResumen(); } } }));
  document.querySelectorAll('.item[data-clave]').forEach((el) => { const leer = () => { const i = porClave.get(el.dataset.clave); if (i && marcas.estado(i) !== 'leido') { marcas.leer([i]); el.querySelector('.marca').outerHTML = marca(i); actualizarResumen(); } };
    el.addEventListener('click', leer); el.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); leer(); } }); });
  document.querySelectorAll('.subtab').forEach((b) => b.onclick = () => { pestana = b.dataset.p; store.set('panel.pestana', pestana); repintar(); });
  $('#leer-todo')?.addEventListener('click', () => { marcas.leer(items); repintar(); });
  $('#leer-pestana')?.addEventListener('click', () => { const tipos = [].concat(PESTANAS[pestana].tipo); marcas.leer(items.filter((i) => tipos.includes(i.tipo))); repintar(); });
  // El resumen de novedades se recalcula sin repintar todo (no se cierran las fases abiertas).
  function actualizarResumen() {
    const c = cuenta(() => true);
    const txt = $('.nov-txt');
    if (txt) txt.innerHTML = c.nuevo + c.actualizado + c.sinleer === 0 ? '<b>✓ Estás al día.</b> No hay nada nuevo ni sin leer.' : `<b>Novedades:</b> <span class="m-nuevo">🆕 ${c.nuevo} nuevos</span> · <span class="m-actualizado">🔄 ${c.actualizado} actualizados</span> · <span class="m-sinleer">● ${c.sinleer} sin leer</span>`;
    document.querySelectorAll('.subtab').forEach((b) => { const k = pendPestana(PESTANAS[b.dataset.p]); b.innerHTML = esc(PESTANAS[b.dataset.p].titulo) + (k ? ` <span class="pill">${k}</span>` : ''); });
  }
}

let vista = ['guia', 'modelos', 'requisitos'].includes(store.get('panel.vista')) ? store.get('panel.vista') : 'progreso';
function marcarVista() {
  $('#v-progreso').setAttribute('aria-pressed', vista === 'progreso');
  $('#v-guia').setAttribute('aria-pressed', vista === 'guia');
  $('#v-modelos').setAttribute('aria-pressed', vista === 'modelos');
  $('#v-requisitos').setAttribute('aria-pressed', vista === 'requisitos');
}
for (const v of ['progreso', 'guia', 'modelos', 'requisitos']) $(`#v-${v}`).onclick = () => { vista = v; store.set('panel.vista', v); ultimo = null; marcarVista(); tick(); };
marcarVista();

const cmd = (c, what) => `<div class="cmd"><code>${esc(c)}</code><button class="copy" type="button" data-c="${esc(c)}">copiar</button><div class="what">${what}</div></div>`;
function guia(slug) {
  const s = slug || '<juego>';
  $('#app').innerHTML = `<div class="guide">
    <div class="card intro"><h2 style="margin:0">Comandos para trabajar con el estudio</h2>
      <p>Los comandos con <b>/</b> se escriben en Claude Code. Los demás, en una terminal (Git Bash o PowerShell). El juego activo es <b>${esc(s)}</b>.</p></div>

    <section class="card"><h3>Sesiones A · B · C</h3><div class="where">Tres sesiones de Claude Code abiertas en D:\Proyectos GC</div>
      ${cmd('Eres la sesión A del estudio. Lee .claude/docs/sesiones.md y coordina a B y C.', '<b>A · Opus 5.5 alto:</b> habla contigo, diseña y reparte el trabajo. Es con quien hablas tú.')}
      ${cmd('Eres la sesión B del estudio. Lee .claude/docs/sesiones.md y preséntate a A.', '<b>B · Sonnet 5.5 alto:</b> implementa las fases que le pasa A.')}
      ${cmd('Eres la sesión C del estudio. Lee .claude/docs/sesiones.md y preséntate a A.', '<b>C · Sonnet 5 medio:</b> verificaciones, ajustes, documentación y bitácora.')}
      <div class="what" style="margin-top:8px">Cuando una sesión se llena de contexto (o lo avisa), ciérrala, abre otra con el mismo modelo y pégale su frase. No se pierde nada: la memoria está en la bitácora.</div>
    </section>

    <section class="card"><h3>Trabajar con Claude</h3><div class="where">En Claude Code, abierto en D:\\Proyectos GC</div>
      ${cmd('/autopiloto', 'Deja a Claude encadenando fases solo durante horas. Para hasta n fases o al primer bloqueo: <code>/autopiloto 5</code>.')}
      ${cmd('/fase', 'Ejecuta la siguiente fase completa: implementa, verifica, registra y hace commit. Puedes indicar una concreta: <code>/fase F03</code>.')}
      ${cmd('/playtest', 'Claude juega con scripts en un navegador real y anota bugs, sensaciones y huecos de diseño.')}
      ${cmd('/bug ', 'Describe un fallo que hayas visto: lo reproduce, crea un test, lo arregla y lo registra.')}
      ${cmd('/carencias', 'Auditoría de diseño: qué falta, qué sobra y qué recomienda, con prioridades.')}
      ${cmd('/explicar ', 'Te enseña un concepto de gamedev con el código del juego, por ejemplo <code>/explicar InstancedMesh</code>.')}
      ${cmd('/roadmap replanificar', 'Reorganiza las fases pendientes, por ejemplo al empezar una versión nueva (v0.2, v0.3…).')}
      ${cmd('/prototipo ', 'Prueba una idea de mecánica en menos de un día y da un veredicto: SEGUIR, CAMBIAR o DESCARTAR.')}
      ${cmd('/postmortem', 'Cierra una versión o un juego y guarda las lecciones en studio/aprendizajes.md.')}
    </section>

    <section class="card"><h3>Jugar y probar el juego</h3><div class="where">Terminal, desde D:\\Proyectos GC</div>
      ${cmd(`cd games/${s} && npm run dev`, 'Arranca el juego. Ábrelo en <b>http://localhost:5173</b>. Se recarga solo cuando Claude cambia el código.')}
      ${cmd(`cd games/${s} && npm run check`, 'Comprueba los tipos y pasa todos los tests. Si sale en verde, la lógica está bien.')}
      ${cmd(`cd games/${s} && npm run shot -- --sin-captura`, 'Abre el juego en un navegador invisible y devuelve su estado y sus errores en JSON.')}
      ${cmd(`cd games/${s} && npm run build`, 'Genera la versión publicable en <code>dist/</code>.')}
    </section>

    <section class="card"><h3>Panel y bitácora</h3><div class="where">Terminal, desde D:\\Proyectos GC</div>
      ${cmd('npm run panel', 'Abre este panel en <b>http://localhost:4400</b>. Se actualiza solo cada 5 s.')}
      ${cmd('node studio/bitacora.mjs estado', 'Resumen rápido del juego activo: fase en curso y siguiente.')}
      ${cmd('node studio/bitacora.mjs juegos', 'Lista todos los juegos del estudio con su progreso.')}
      ${cmd('node studio/bitacora.mjs usar ' + s, 'Cambia el juego activo con el que trabaja Claude.')}
      ${cmd('git log --oneline -15', 'Historial: hay un commit por fase cerrada.')}
    </section>

    <section class="card"><h3>Claude Code: atajos útiles</h3><div class="where">Dentro de Claude Code</div>
      ${cmd('Esc', 'Interrumpe a Claude en mitad de lo que está haciendo, sin perder el trabajo.')}
      ${cmd('! npm run dev', 'Con <b>!</b> delante, ejecutas un comando de terminal sin salir de Claude Code.')}
      ${cmd('/clear', 'Empieza una conversación limpia. Claude retoma desde la bitácora, así que no se pierde nada.')}
      ${cmd('/resume', 'Vuelve a una conversación anterior.')}
      ${cmd('/model', 'Cambia el modelo. Para fases largas, el más capaz.')}
      ${cmd('/effort', 'Ajusta cuánto piensa Claude: más esfuerzo es más calidad, pero gasta más.')}
    </section>

    <section class="card intro"><h3>Cómo trabajar mejor</h3><ul class="tips">
      <li>Lanza <code>/autopiloto</code> antes de irte y revisa aquí al volver: <b>Progreso → Decisiones</b> te dice qué decidió Claude sin preguntarte.</li>
      <li>Si algo no te gusta al jugar, descríbelo con <code>/bug</code> (si es un fallo) o en lenguaje normal (si es una idea de diseño).</li>
      <li>Antes de empezar cada versión nueva (v0.2…), pide <code>/carencias</code> y después <code>/roadmap replanificar</code>.</li>
      <li>Los documentos de diseño están en <code>games/${esc(s)}/docs/</code>: vision.md, gdd/ y versiones.md.</li>
    </ul></section>
  </div>`;
  document.querySelectorAll('.copy').forEach((b) => b.onclick = async () => {
    try { await navigator.clipboard.writeText(b.dataset.c.trim()); b.textContent = 'copiado'; b.classList.add('ok'); }
    catch { b.textContent = 'selecciónalo'; }
    setTimeout(() => { b.textContent = 'copiar'; b.classList.remove('ok'); }, 1500);
  });
}

async function tick() {
  try {
    const js = await (await fetch('/api/juegos')).json();
    if (!js.length) {
      $('#games').innerHTML = '';
      $('#app').innerHTML = `<div class="card welcome"><h2>Aún no hay juegos</h2><p>En Claude Code ejecuta <code>/nuevo-juego</code> para crear el primero.</p></div>`;
      $('#updated').textContent = 'esperando'; return;
    }
    if (!juego || !js.some((g) => g.slug === juego)) juego = (js.find((g) => g.activo) || js[0]).slug;
    $('#games').innerHTML = js.map((g) => `<button class="game-tab" type="button" data-slug="${esc(g.slug)}" aria-pressed="${g.slug === juego}">${esc(g.nombre)} · ${g.hechas}/${g.fases}${g.activo ? ' ●' : ''}</button>`).join('');
    document.querySelectorAll('.game-tab').forEach((b) => b.onclick = () => { juego = b.dataset.slug; store.set('panel.juego', juego); ultimo = null; tick(); });
    if (vista === 'modelos') {
      // La pestaña se pinta una vez por juego: no se repinta en cada tick (perdería filtros y foco).
      // El marco del laboratorio (módulo aparte) puede tardar un instante en estar listo: se reintenta enseguida.
      if (ultimo !== 'modelos:' + juego) {
        if (window.panelLab) { window.panelLab.mostrar(juego, $('#app')); ultimo = 'modelos:' + juego; }
        else { $('#app').innerHTML = '<p class="empty">Cargando…</p>'; setTimeout(tick, 300); }
      }
      $('#updated').textContent = 'pixel art'; return;
    }
    if (vista === 'guia') { if (ultimo !== 'guia:' + juego) { guia(juego); ultimo = 'guia:' + juego; } $('#updated').textContent = 'guía'; return; }
    if (vista === 'requisitos') {
      if (ultimo !== 'requisitos:' + juego) {
        if (window.panelLab) { window.panelLab.mostrarRequisitos(juego, $('#app')); ultimo = 'requisitos:' + juego; }
        else { $('#app').innerHTML = '<p class="empty">Cargando…</p>'; setTimeout(tick, 300); }
      }
      $('#updated').textContent = 'lo que pediste'; return;
    }
    const r = await fetch(`/api/estado/${encodeURIComponent(juego)}`);
    if (!r.ok) { $('#app').innerHTML = `<div class="card welcome"><p>Este juego aún no tiene bitácora.</p></div>`; return; }
    const e = await r.json();
    if (e.actualizado !== ultimo) { render(e); ultimo = e.actualizado; }
    $('#updated').textContent = `actualizado ${hace(e.actualizado)}`;
    $('#dot').classList.toggle('stale', Date.now() - new Date(e.actualizado) > 30 * 60 * 1000);
  } catch {
    $('#updated').textContent = 'sin conexión con el servidor';
    $('#dot').classList.add('stale');
  }
}
tick();
setInterval(tick, 5000);
</script>
<script type="module" src="/laboratorio.js"></script>

</body>
</html>
